<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blogg</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Adminpanel</h1>
  <div class="top-bar">
    {% if current_user %}
        <span class="user-info">Inloggad som: <b>{{ current_user }}</b></span>
        <a class="btn" href="/logout">Logout</a>
    {% endif %}
    <a class="btn" href="/">Till startsidan</a>
    <a class="btn" href="/new">➕ Nytt inlägg</a>
</div>

<h1>Blogginlägg</h1>
<div class="posts">
  {% for pid, title, content, image in posts %}
    <div class="post">
        <h2>{{ title }}</h2>
        {% if image %}
            <img src="{{ image }}" alt="Bild för {{ title }}" class="post-image">
        {% endif %}
        <p>{{ content }}</p>
        <a href="/edit/{{ pid }}">✏️ Redigera</a>
        <a href="/delete/{{ pid }}">🗑️ Ta bort</a>
    </div>
  {% endfor %}
</div>
 
</body>
</html>
